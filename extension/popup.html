<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JobAgent</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f6f7fb;
        width: 260px;
        padding: 14px;
        box-sizing: border-box;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        font-size: 14px;
      }
      .toggle {
        position: relative;
        display: inline-block;
        width: 48px;
        height: 26px;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #d1d5db;
        transition: 0.2s;
        border-radius: 999px;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 4px;
        top: 4px;
        background: white;
        border-radius: 50%;
        transition: 0.2s;
      }
      input:checked + .slider {
        background: #4f46e5;
      }
      input:checked + .slider::before {
        transform: translateX(22px);
      }
      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        margin-top: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .primary {
        background: #4f46e5;
        color: white;
      }
      .secondary {
        background: #e5e7eb;
        color: #1f2937;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <h3>JobAgent</h3>

    <div class="row">
      <span>Turn on</span>
      <label class="toggle">
        <input id="enabledToggle" type="checkbox" checked />
        <span class="slider"></span>
      </label>
    </div>

    <button id="settingsBtn" class="secondary">Settings</button>

    <div id="status" class="status">Extension is on</div>

    <script src="popup.js"></script>
  </body>
</html>
